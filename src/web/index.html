<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#0a0b0f">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>Jarvis</title>
    <link rel="stylesheet" href="/style.css">
  </head>
  <body>

    <header class="topbar">
      <div class="topbar-brand">
        <span class="brand-icon">◈</span>
        <span class="brand-name">JARVIS</span>
      </div>
      <div class="topbar-right">
        <button class="btn-topbar-icon" id="reminders-open-btn" type="button" aria-label="Abrir lembretes">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
          <span class="topbar-badge" id="reminders-badge" hidden>0</span>
        </button>
        <button class="btn-topbar-icon" id="memory-open-btn" type="button" aria-label="Abrir memória">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2a9 9 0 0 1 9 9c0 4.17-2.84 7.67-6.75 8.7L12 22l-2.25-2.3C5.84 18.67 3 15.17 3 11a9 9 0 0 1 9-9z"/><circle cx="12" cy="11" r="3"/></svg>
          <span class="topbar-badge" id="memory-badge" hidden>0</span>
        </button>
        <div class="status-pill" id="status-pill">
          <span class="dot"></span>
          <span id="status-text">conectando</span>
        </div>
      </div>
    </header>

    <div class="drawer-backdrop" id="drawer-backdrop"></div>

    <aside class="side-drawer" id="reminders-drawer" aria-hidden="true">
      <div class="drawer-handle"></div>
      <div class="drawer-header">
        <h2 class="drawer-title rem-title">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
          Lembretes
        </h2>
        <button class="btn-drawer-close" id="reminders-close-btn" type="button" aria-label="Fechar">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
        </button>
      </div>

      <p class="drawer-hint">Crie lembretes pelo chat: <em>"me lembre de beber água às 15h"</em></p>

      <div class="drawer-list-wrap">
        <div class="drawer-loading" id="reminders-loading">
          <span></span><span></span><span></span>
        </div>
        <ul class="reminder-list" id="reminder-list"></ul>
        <p class="drawer-empty" id="reminders-empty" hidden>Nenhum lembrete agendado.</p>
      </div>
    </aside>

    <aside class="side-drawer" id="memory-drawer" aria-hidden="true">
      <div class="drawer-handle"></div>
      <div class="drawer-header">
        <h2 class="drawer-title">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2a9 9 0 0 1 9 9c0 4.17-2.84 7.67-6.75 8.7L12 22l-2.25-2.3C5.84 18.67 3 15.17 3 11a9 9 0 0 1 9-9z"/><circle cx="12" cy="11" r="3"/></svg>
          Memória
        </h2>
        <button class="btn-drawer-close" id="memory-close-btn" type="button" aria-label="Fechar">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
        </button>
      </div>

      <form class="memory-add-form" id="memory-add-form" autocomplete="off">
        <div class="memory-add-row">
          <select class="memory-kind-select" id="memory-kind" aria-label="Categoria">
            <option value="notes">Nota</option>
            <option value="task">Tarefa</option>
            <option value="reminder">Lembrete</option>
            <option value="fact">Fato</option>
          </select>
          <input
            class="memory-add-input"
            id="memory-add-input"
            type="text"
            placeholder="Adicionar à memória…"
            autocomplete="off"
            autocorrect="off"
            spellcheck="false"
          >
          <button class="btn-memory-add" type="submit" aria-label="Salvar">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
          </button>
        </div>
      </form>

      <div class="memory-list-wrap">
        <div class="memory-loading" id="memory-loading">
          <span></span><span></span><span></span>
        </div>
        <ul class="memory-list" id="memory-list"></ul>
        <p class="memory-empty" id="memory-empty" hidden>Nenhum item na memória ainda.</p>
      </div>
    </aside>

    <main class="feed" id="feed">
      <div class="feed-empty" id="feed-empty">
        <span class="feed-empty-icon">◈</span>
        <p>Pronto para ouvir você.</p>
      </div>
    </main>

    <footer class="toolbar">
      <div class="input-row">
        <input
          id="command-input"
          type="text"
          autocomplete="off"
          autocorrect="off"
          spellcheck="false"
          placeholder="Digite um comando…"
          enterkeyhint="send"
        >
        <button class="btn-send" id="send-button" type="button" aria-label="Enviar">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/></svg>
        </button>
      </div>
      <button class="btn-voice" id="voice-button" type="button" aria-label="Comando de voz">
        <span class="voice-ring"></span>
        <svg class="voice-icon" width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"/>
          <path d="M19 10v2a7 7 0 0 1-14 0v-2"/>
          <line x1="12" y1="19" x2="12" y2="23"/>
          <line x1="8" y1="23" x2="16" y2="23"/>
        </svg>
      </button>
    </footer>

    <script type="module" src="/app.js"></script>
  </body>
</html>
